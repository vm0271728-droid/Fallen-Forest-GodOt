name: Fast Godot script validation

on:
  workflow_dispatch:
  push:
    paths:
      - "project.godot"
      - "scripts/**"
      - "tools/fast_validate_scripts.gd"
      - ".github/workflows/godot-fast-validate.yml"

permissions:
  contents: write

concurrency:
  group: godot-fast-validate-main
  cancel-in-progress: true

jobs:
  validate-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Prepare stripped validation project
        run: |
          rm -rf /tmp/ff-fast
          mkdir -p /tmp/ff-fast/tools
          cp project.godot /tmp/ff-fast/project.godot
          sed -i '/^run\/main_scene=/d' /tmp/ff-fast/project.godot
          cp -R scripts /tmp/ff-fast/scripts
          cp tools/fast_validate_scripts.gd /tmp/ff-fast/tools/

          # Only copy assets referenced by script-level preload(). The full asset
          # import remains the responsibility of the slower main validation job.
          mkdir -p /tmp/ff-fast/assets/environment/grass/source
          mkdir -p /tmp/ff-fast/assets/player/flashlight/source
          mkdir -p /tmp/ff-fast/assets/audio/screamers
          cp assets/environment/grass/source/Grass.fbx /tmp/ff-fast/assets/environment/grass/source/
          cp assets/player/flashlight/source/flashlightfbx.fbx /tmp/ff-fast/assets/player/flashlight/source/
          cp assets/audio/screamers/*.mp3 /tmp/ff-fast/assets/audio/screamers/

      - name: Import lightweight preload dependencies
        shell: bash
        run: |
          set -o pipefail
          timeout 180s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path /tmp/ff-fast --quit-after 6 \
            2>&1 | tee /tmp/ff-fast-import.log

      - name: Compile every GDScript
        id: compile
        shell: bash
        run: |
          set +e
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path /tmp/ff-fast \
            --script res://tools/fast_validate_scripts.gd \
            > /tmp/ff-fast-validate.log 2>&1
          CODE=$?
          cat /tmp/ff-fast-validate.log
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record fast validation result
        if: always()
        shell: bash
        run: |
          CODE='${{ steps.compile.outputs.code }}'
          if [ -z "$CODE" ]; then CODE=999; fi
          mkdir -p docs
          {
            echo '# Fast Godot script validation'
            echo
            echo '- Engine: Godot 4.7.1 stable'
            echo "- Tested commit: \`$GITHUB_SHA\`"
            echo "- Exit code: \`$CODE\`"
            if [ "$CODE" = "0" ]; then
              echo '- Result: **PASS**'
            else
              echo '- Result: **FAIL**'
            fi
            echo
            echo '```text'
            tail -n 160 /tmp/ff-fast-validate.log 2>/dev/null || true
            echo '```'
          } > docs/GODOT_FAST_VALIDATION.md

          git config user.name "Fallen Forest Fast Validator"
          git config user.email "actions@users.noreply.github.com"
          git add docs/GODOT_FAST_VALIDATION.md
          if ! git diff --cached --quiet; then
            git pull --rebase origin main || true
            git add docs/GODOT_FAST_VALIDATION.md
            git commit -m "Record fast Godot validation for $GITHUB_SHA"
            git push origin HEAD:main || true
          fi

          if [ "$CODE" != "0" ]; then
            exit "$CODE"
          fi
