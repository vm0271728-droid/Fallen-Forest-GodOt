name: Expand committed tree packs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/expand-tree-packs.yml"
      - "tools/expand_existing_tree_packs.py"
      - "tools/import_drive_assets.py"

permissions:
  contents: write

concurrency:
  group: expand-tree-packs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expand-tree-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install RAR extraction support
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Expand committed tree packs
        run: python tools/expand_existing_tree_packs.py

      - name: Verify tree-only outputs
        shell: bash
        run: |
          test ! -f assets/environment/trees/dead_firs/firs.obj
          test -s assets/environment/trees/dead_firs/source_archive/firs.obj
          test -f assets/environment/trees/dead_firs/source_archive/.gdignore
          for OBJ in assets/environment/trees/dead_firs/variants/fir_*.obj; do
            test -s "$OBJ"
            SECTIONS=$(grep -c '^usemtl ' "$OBJ" || true)
            echo "$OBJ material sections: $SECTIONS"
            if [ "$SECTIONS" -gt 16 ]; then
              echo "Too many material sections in $OBJ" >&2
              exit 1
            fi
          done

          test -f assets/environment/trees/low_poly_pack/source/Tree_Pack.fbx
          test -f assets/environment/trees/low_poly_pack/source/Tree_Pack.obj
          for DEP in ROCKS_AO.png ROCKS_DIFFUSE.png ROCKS_NORMALtest.png ROCKS_ROUGHNESS.png; do
            test -s "assets/environment/trees/low_poly_pack/source/$DEP"
          done
          test ! -f 'assets/environment/trees/low_poly_pack/source/LOW POLY FOREST TREE PACK.rar'
          if find assets/environment/trees/low_poly_pack/textures -maxdepth 1 -type f \
            \( -iname 'ROCKS_*' -o -iname 'internal_ground*' \) | grep -q .; then
            echo 'Unused rock/ground payload leaked into runtime texture folder.' >&2
            exit 1
          fi

      - name: Commit normalized outputs safely
        shell: bash
        run: |
          git config user.name "Fallen Forest Tree Pack Expander"
          git config user.email "actions@users.noreply.github.com"

          git add assets/environment/trees/dead_firs/variants
          git add assets/environment/trees/dead_firs/source_archive/.gdignore
          git add assets/environment/trees/dead_firs/source_archive/firs.obj
          git add -u assets/environment/trees/dead_firs/firs.obj
          git add assets/environment/trees/low_poly_pack/source/ROCKS_AO.png
          git add assets/environment/trees/low_poly_pack/source/ROCKS_DIFFUSE.png
          git add assets/environment/trees/low_poly_pack/source/ROCKS_NORMALtest.png
          git add assets/environment/trees/low_poly_pack/source/ROCKS_ROUGHNESS.png

          if git diff --cached --quiet; then
            echo "Tree pack outputs already normalized."
            exit 0
          fi
          git commit -m "Archive raw tree sources and normalize runtime imports"
          git push origin HEAD:"$GITHUB_REF_NAME"
