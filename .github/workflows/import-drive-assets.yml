name: Import canonical Drive assets
# Import trigger revision: 2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-drive-assets.yml"
      - "tools/import_drive_assets.py"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install import dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python -m pip install --disable-pip-version-check gdown

      - name: Download canonical owner archives
        run: |
          python -m gdown 1W9RzSrC8SWn1BJCa_i0OU2Wkk0L0LQe6 -O /tmp/fallen_forest_all.zip
          python -m gdown 11nhh2Q0djgdQm653EQkWJjqSpdJ9SEFk -O /tmp/fallen_forest_trees.zip

      - name: Extract models, textures and approved media
        run: |
          python tools/import_drive_assets.py \
            --all /tmp/fallen_forest_all.zip \
            --trees /tmp/fallen_forest_trees.zip

      - name: Verify canonical exclusions
        run: |
          if find assets -type f -iname '*amazing-grace*' | grep -q .; then
            echo 'Forbidden Amazing Grace asset was imported.' >&2
            exit 1
          fi
          if find assets/environment/trees/low_poly_pack -type f \
            \( -iname 'ROCKS_*' -o -iname 'internal_ground_ao_texture*' \) | grep -q .; then
            echo 'Non-tree low-poly pack payload was retained unexpectedly.' >&2
            exit 1
          fi

      - name: Commit imported source assets
        run: |
          git config user.name "Fallen Forest Asset Importer"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets docs/ASSET_INVENTORY.md
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Expand canonical tree packs and keep tree-only low-poly assets"
          git push origin HEAD:main
