name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scripts/**"
      - "scenes/**"
      - "assets/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: write

concurrency:
  group: fallen-forest-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot 4.7 Android SDK requirements
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Download Godot 4.7.1 and export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          curl -L --fail --retry 3 \
            -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz

          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Create temporary Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Fallen Forest,C=US"

      - name: Configure Godot Android editor paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project before export
        id: import
        shell: bash
        run: |
          set +e
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          timeout 420s "$GODOT" --headless --path . --import > /tmp/android-import.log 2>&1
          CODE=$?
          cat /tmp/android-import.log
          if grep -Eq 'SCRIPT ERROR:|ERROR: Condition|Failed to load script|Compilation failed|Parse Error|Compile Error' /tmp/android-import.log; then
            CODE=1
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install Gradle template and export Android 11+ APK
        id: export
        if: steps.import.outputs.code == '0'
        shell: bash
        run: |
          set +e
          mkdir -p Builds/Android
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . \
            --install-android-build-template \
            --export-debug "Android" "Builds/Android/FallenForest-debug.apk" \
            > /tmp/android-export.log 2>&1
          CODE=$?
          cat /tmp/android-export.log
          test -d android/build || CODE=1
          test -s Builds/Android/FallenForest-debug.apk || CODE=1
          if grep -Eq 'SCRIPT ERROR:|Failed to load script|Compilation failed|Parse Error|Compile Error|ERROR:.*export' /tmp/android-export.log; then
            CODE=1
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify APK manifest and ABI
        id: verify
        if: steps.export.outputs.code == '0'
        shell: bash
        run: |
          set +e
          APK="Builds/Android/FallenForest-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          BADGING="$($AAPT dump badging "$APK" 2>&1)"
          CODE=$?
          printf '%s\n' "$BADGING" | tee /tmp/android-badging.log

          MIN_SDK="$(printf '%s\n' "$BADGING" | sed -n "s/.*sdkVersion:'\([^']*\)'.*/\1/p" | head -n1)"
          TARGET_SDK="$(printf '%s\n' "$BADGING" | sed -n "s/.*targetSdkVersion:'\([^']*\)'.*/\1/p" | head -n1)"
          [ "$MIN_SDK" = "30" ] || CODE=1
          [ "$TARGET_SDK" = "35" ] || CODE=1
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/' || CODE=1
          if unzip -Z1 "$APK" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            CODE=1
          fi

          echo "min_sdk=$MIN_SDK" >> "$GITHUB_OUTPUT"
          echo "target_sdk=$TARGET_SDK" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload APK
        if: steps.verify.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: FallenForest-Android11plus-debug
          path: Builds/Android/FallenForest-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record Android validation result
        if: always()
        shell: bash
        run: |
          IMPORT_CODE='${{ steps.import.outputs.code }}'
          EXPORT_CODE='${{ steps.export.outputs.code }}'
          VERIFY_CODE='${{ steps.verify.outputs.code }}'
          MIN_SDK='${{ steps.verify.outputs.min_sdk }}'
          TARGET_SDK='${{ steps.verify.outputs.target_sdk }}'
          if [ -z "$IMPORT_CODE" ]; then IMPORT_CODE=999; fi
          if [ -z "$EXPORT_CODE" ]; then EXPORT_CODE=999; fi
          if [ -z "$VERIFY_CODE" ]; then VERIFY_CODE=999; fi
          OVERALL=0
          for CODE in "$IMPORT_CODE" "$EXPORT_CODE" "$VERIFY_CODE"; do
            if [ "$CODE" != "0" ]; then OVERALL=1; fi
          done

          mkdir -p docs
          {
            echo '# Android APK validation status'
            echo
            echo '- Engine: Godot 4.7.1 stable'
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Tested commit: \`$GITHUB_SHA\`"
            echo '- Required minimum: Android 11 / API 30'
            echo '- Required ABI: arm64-v8a only'
            echo "- Import exit code: \`$IMPORT_CODE\`"
            echo "- Export exit code: \`$EXPORT_CODE\`"
            echo "- Manifest/ABI verification exit code: \`$VERIFY_CODE\`"
            echo "- APK minSdk: \`${MIN_SDK:-unknown}\`"
            echo "- APK targetSdk: \`${TARGET_SDK:-unknown}\`"
            if [ "$OVERALL" = "0" ]; then
              echo '- Result: **PASS**'
            else
              echo '- Result: **FAIL**'
            fi
            echo
            echo '## Import log tail'
            echo '```text'
            tail -n 100 /tmp/android-import.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Export log tail'
            echo '```text'
            tail -n 140 /tmp/android-export.log 2>/dev/null || true
            echo '```'
            echo
            echo '## APK badging'
            echo '```text'
            cat /tmp/android-badging.log 2>/dev/null || true
            echo '```'
          } > docs/ANDROID_BUILD_VALIDATION.md

          git config user.name "Fallen Forest Android Validator"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ANDROID_BUILD_VALIDATION.md
          if ! git diff --cached --quiet; then
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git add docs/ANDROID_BUILD_VALIDATION.md
            git commit -m "Record Android validation for $GITHUB_SHA"
            git push origin HEAD:"$GITHUB_REF_NAME" || true
          fi

      - name: Enforce Android validation result
        if: always()
        shell: bash
        run: |
          IMPORT_CODE='${{ steps.import.outputs.code }}'
          EXPORT_CODE='${{ steps.export.outputs.code }}'
          VERIFY_CODE='${{ steps.verify.outputs.code }}'
          if [ "$IMPORT_CODE" != "0" ] || [ "$EXPORT_CODE" != "0" ] || [ "$VERIFY_CODE" != "0" ]; then
            exit 1
          fi
