name: Build Nocturne Forest APK

on:
  push:
    branches: ["nocturne-forest-apk-build"]
    paths:
      - "NocturneForestDemo/**"
      - ".github/workflows/nocturne-forest-demo-apk.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "NocturneForestDemo/**"
      - ".github/workflows/nocturne-forest-demo-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          rm -rf /tmp/godot-templates && mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
      - name: Debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nocturne Forest,O=OpenAI Demo,C=DE"
      - name: Configure Godot Android
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import project
        working-directory: NocturneForestDemo
        shell: bash
        run: |
          timeout 420s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import
      - name: Build APK
        working-directory: NocturneForestDemo
        shell: bash
        run: |
          mkdir -p build
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --export-debug "Android" "build/NocturneForest.apk"
          test -s build/NocturneForest.apk
          file build/NocturneForest.apk
          unzip -t build/NocturneForest.apk >/dev/null
          ls -lh build/NocturneForest.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NocturneForest-Android11Plus
          path: NocturneForestDemo/build/NocturneForest.apk
          if-no-files-found: error
          retention-days: 14
