name: Build Nocturne Forest APK

on:
  push:
    branches: ["nocturne-forest-apk-build"]
    paths:
      - "NocturneForestDemo/**"
      - "!NocturneForestDemo/build/**"
      - ".github/workflows/nocturne-forest-demo-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nocturne-forest-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          rm -rf /tmp/godot-templates && mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
      - name: Debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nocturne Forest,O=OpenAI Demo,C=DE"
      - name: Configure Godot Android
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import, smoke-test and build APK
        id: compile
        working-directory: NocturneForestDemo
        shell: bash
        run: |
          set +e
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          mkdir -p build
          timeout 420s "$GODOT" --headless --path . --import > /tmp/nocturne-import.log 2>&1
          IMPORT_CODE=$?
          SMOKE_CODE=999
          BUILD_CODE=999
          if [ "$IMPORT_CODE" = "0" ]; then
            timeout 25s "$GODOT" --headless --path . --quit-after 12 > /tmp/nocturne-smoke.log 2>&1
            SMOKE_CODE=$?
            if grep -Eqi "SCRIPT ERROR|Parse Error|Invalid call|Invalid access" /tmp/nocturne-smoke.log; then
              SMOKE_CODE=1
            fi
          else
            echo "Smoke test skipped because import failed." > /tmp/nocturne-smoke.log
          fi
          if [ "$IMPORT_CODE" = "0" ] && [ "$SMOKE_CODE" = "0" ]; then
            "$GODOT" --headless --path . --export-debug "Android" "build/NocturneForest.apk" > /tmp/nocturne-export.log 2>&1
            BUILD_CODE=$?
          else
            echo "Export skipped because import or smoke test failed." > /tmp/nocturne-export.log
          fi
          echo "import_code=$IMPORT_CODE" >> "$GITHUB_OUTPUT"
          echo "smoke_code=$SMOKE_CODE" >> "$GITHUB_OUTPUT"
          echo "build_code=$BUILD_CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload APK artifact
        if: steps.compile.outputs.import_code == '0' && steps.compile.outputs.smoke_code == '0' && steps.compile.outputs.build_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: NocturneForest-APK-v0.1.1
          path: NocturneForestDemo/build/NocturneForest.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish build result to branch
        if: always()
        shell: bash
        run: |
          mkdir -p APK_OUTPUT
          {
            echo "Nocturne Forest Android build"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "import_code=${{ steps.compile.outputs.import_code }}"
            echo "smoke_code=${{ steps.compile.outputs.smoke_code }}"
            echo "build_code=${{ steps.compile.outputs.build_code }}"
            echo
            echo "--- import log ---"
            tail -n 180 /tmp/nocturne-import.log 2>/dev/null || true
            echo
            echo "--- smoke log ---"
            tail -n 180 /tmp/nocturne-smoke.log 2>/dev/null || true
            echo
            echo "--- export log ---"
            tail -n 220 /tmp/nocturne-export.log 2>/dev/null || true
          } > APK_OUTPUT/build_status.txt
          if [ -s NocturneForestDemo/build/NocturneForest.apk ]; then
            cp NocturneForestDemo/build/NocturneForest.apk APK_OUTPUT/NocturneForest.apk
            unzip -t APK_OUTPUT/NocturneForest.apk >/dev/null
          fi
          git config user.name "Nocturne APK Builder"
          git config user.email "actions@users.noreply.github.com"
          git add APK_OUTPUT/build_status.txt
          if [ -f APK_OUTPUT/NocturneForest.apk ]; then git add -f APK_OUTPUT/NocturneForest.apk; fi
          git commit -m "Publish Nocturne Forest APK" || true
          git push origin HEAD:nocturne-forest-apk-build
      - name: Verify build success
        shell: bash
        run: |
          test "${{ steps.compile.outputs.import_code }}" = "0"
          test "${{ steps.compile.outputs.smoke_code }}" = "0"
          test "${{ steps.compile.outputs.build_code }}" = "0"
          test -s APK_OUTPUT/NocturneForest.apk
