name: Validate Godot project

on:
  workflow_dispatch:
  push:
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "assets/**"
      - "tools/inspect_assets.gd"
      - "tools/validate_collision_core.gd"
      - "tools/validate_collision_core.tscn"
      - ".github/workflows/godot-validate.yml"

permissions:
  contents: write

concurrency:
  group: godot-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import, smoke-test and inspect project
        id: validation
        shell: bash
        run: |
          set +e
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64

          timeout 360s "$GODOT" --headless --path . --import > /tmp/godot-import.log 2>&1
          IMPORT_CODE=$?
          if grep -Eq 'SCRIPT ERROR:|ERROR: Condition|Failed to load script|Compilation failed|Parse Error|Compile Error' /tmp/godot-import.log; then IMPORT_CODE=1; fi

          MENU_CODE=0
          GAME_CODE=0
          PHYSICS_CODE=0
          INSPECT_CODE=0
          if [ "$IMPORT_CODE" = "0" ]; then
            timeout 25s "$GODOT" --headless --path . --scene res://scenes/ui/main_menu.tscn --quit-after 6 > /tmp/godot-menu-smoke.log 2>&1
            MENU_CODE=$?
            if grep -Eq 'SCRIPT ERROR:|Failed to load script|Parse Error|Compile Error|Invalid call|Invalid access' /tmp/godot-menu-smoke.log; then MENU_CODE=1; fi

            timeout 70s "$GODOT" --headless --path . --scene res://scenes/main/main.tscn --quit-after 14 > /tmp/godot-game-smoke.log 2>&1
            GAME_CODE=$?
            if grep -Eq 'SCRIPT ERROR:|Failed to load script|Parse Error|Compile Error|Invalid call|Invalid access' /tmp/godot-game-smoke.log; then GAME_CODE=1; fi

            timeout 90s "$GODOT" --headless --path . --scene res://tools/validate_collision_core.tscn > /tmp/godot-physics.log 2>&1
            PHYSICS_CODE=$?
            if ! grep -q 'COLLISION_CORE_VALIDATION: PASS' /tmp/godot-physics.log; then PHYSICS_CODE=1; fi
            if grep -Eq 'SCRIPT ERROR:|Failed to load script|Parse Error|Compile Error|Invalid call|Invalid access' /tmp/godot-physics.log; then PHYSICS_CODE=1; fi

            timeout 120s "$GODOT" --headless --path . --script res://tools/inspect_assets.gd > /tmp/godot-assets.log 2>&1
            INSPECT_CODE=$?
            if grep -Eq 'SCRIPT ERROR:|Failed to load script|Parse Error|Compile Error|Invalid call|Invalid access' /tmp/godot-assets.log; then INSPECT_CODE=1; fi
          else
            echo 'Skipped because import failed.' > /tmp/godot-menu-smoke.log
            echo 'Skipped because import failed.' > /tmp/godot-game-smoke.log
            echo 'Skipped because import failed.' > /tmp/godot-physics.log
            echo 'Skipped because import failed.' > /tmp/godot-assets.log
          fi

          CODE=$IMPORT_CODE
          if [ "$CODE" = "0" ] && [ "$MENU_CODE" != "0" ]; then CODE=$MENU_CODE; fi
          if [ "$CODE" = "0" ] && [ "$GAME_CODE" != "0" ]; then CODE=$GAME_CODE; fi
          if [ "$CODE" = "0" ] && [ "$PHYSICS_CODE" != "0" ]; then CODE=$PHYSICS_CODE; fi
          if [ "$CODE" = "0" ] && [ "$INSPECT_CODE" != "0" ]; then CODE=$INSPECT_CODE; fi

          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "import_code=$IMPORT_CODE" >> "$GITHUB_OUTPUT"
          echo "menu_code=$MENU_CODE" >> "$GITHUB_OUTPUT"
          echo "game_code=$GAME_CODE" >> "$GITHUB_OUTPUT"
          echo "physics_code=$PHYSICS_CODE" >> "$GITHUB_OUTPUT"
          echo "inspect_code=$INSPECT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build validation report
        if: always()
        shell: bash
        run: |
          CODE='${{ steps.validation.outputs.code }}'; [ -n "$CODE" ] || CODE=999
          IMPORT_CODE='${{ steps.validation.outputs.import_code }}'; [ -n "$IMPORT_CODE" ] || IMPORT_CODE=999
          MENU_CODE='${{ steps.validation.outputs.menu_code }}'; [ -n "$MENU_CODE" ] || MENU_CODE=999
          GAME_CODE='${{ steps.validation.outputs.game_code }}'; [ -n "$GAME_CODE" ] || GAME_CODE=999
          PHYSICS_CODE='${{ steps.validation.outputs.physics_code }}'; [ -n "$PHYSICS_CODE" ] || PHYSICS_CODE=999
          INSPECT_CODE='${{ steps.validation.outputs.inspect_code }}'; [ -n "$INSPECT_CODE" ] || INSPECT_CODE=999

          {
            echo '# Godot validation status'
            echo
            echo '- Engine: Godot 4.7.1 stable'
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Tested commit: \`$GITHUB_SHA\`"
            echo "- Full asset import exit code: \`$IMPORT_CODE\`"
            echo "- Main-menu smoke-test exit code: \`$MENU_CODE\`"
            echo "- Gameplay smoke-test exit code: \`$GAME_CODE\`"
            echo "- Runtime floor/tree physics exit code: \`$PHYSICS_CODE\`"
            echo "- Asset inspection exit code: \`$INSPECT_CODE\`"
            echo "- Overall exit code: \`$CODE\`"
            if [ "$CODE" = "0" ]; then echo '- Result: **PASS**'; else echo '- Result: **FAIL**'; fi
            echo
            echo '## MAX_MESH_SURFACES context'
            echo '```text'
            grep -n -B 12 -A 2 'MAX_MESH_SURFACES' /tmp/godot-import.log 2>/dev/null | head -n 700 || true
            echo '```'
            echo
            echo '## Last imported resources'
            echo '```text'
            grep -E 'reimport.*\|' /tmp/godot-import.log 2>/dev/null | tail -n 60 || true
            echo '```'
            echo
            echo '## Import log tail'
            echo '```text'
            tail -n 120 /tmp/godot-import.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Main-menu smoke'
            echo '```text'; tail -n 80 /tmp/godot-menu-smoke.log 2>/dev/null || true; echo '```'
            echo
            echo '## Gameplay smoke'
            echo '```text'; tail -n 120 /tmp/godot-game-smoke.log 2>/dev/null || true; echo '```'
            echo
            echo '## Floor/tree physics'
            echo '```text'; tail -n 100 /tmp/godot-physics.log 2>/dev/null || true; echo '```'
            echo
            echo '## Asset inspector'
            echo '```text'; tail -n 80 /tmp/godot-assets.log 2>/dev/null || true; echo '```'
          } > /tmp/GODOT_VALIDATION.md

          if [ -f docs/ASSET_IMPORT_REPORT.md ]; then cp docs/ASSET_IMPORT_REPORT.md /tmp/ASSET_IMPORT_REPORT.md; fi

      - name: Publish validation report safely
        if: always()
        shell: bash
        run: |
          git config user.name "Fallen Forest Godot Validator"
          git config user.email "actions@users.noreply.github.com"
          PUBLISHED=0
          for ATTEMPT in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p docs
            cp /tmp/GODOT_VALIDATION.md docs/GODOT_VALIDATION.md
            if [ -f /tmp/ASSET_IMPORT_REPORT.md ]; then cp /tmp/ASSET_IMPORT_REPORT.md docs/ASSET_IMPORT_REPORT.md; fi
            git add docs/GODOT_VALIDATION.md
            if [ -f /tmp/ASSET_IMPORT_REPORT.md ]; then git add docs/ASSET_IMPORT_REPORT.md; fi
            if git diff --cached --quiet; then PUBLISHED=1; break; fi
            git commit -m "Record Godot validation for $GITHUB_SHA"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then PUBLISHED=1; break; fi
          done
          if [ "$PUBLISHED" != "1" ]; then exit 1; fi

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          CODE='${{ steps.validation.outputs.code }}'
          if [ -z "$CODE" ] || [ "$CODE" != "0" ]; then exit 1; fi
