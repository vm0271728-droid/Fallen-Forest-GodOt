name: Validate Godot project

on:
  push:
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "assets/**"
      - "tools/inspect_assets.gd"
      - ".github/workflows/godot-validate.yml"

permissions:
  contents: write

concurrency:
  group: godot-validate-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import, smoke-test and inspect project
        id: validation
        shell: bash
        run: |
          set +e
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64

          timeout 300s "$GODOT" --headless --path . --import \
            > /tmp/godot-import.log 2>&1
          IMPORT_CODE=$?
          cat /tmp/godot-import.log

          SMOKE_CODE=0
          if [ "$IMPORT_CODE" = "0" ]; then
            timeout 40s "$GODOT" --headless --path . --quit-after 6 \
              > /tmp/godot-smoke.log 2>&1
            SMOKE_CODE=$?
            cat /tmp/godot-smoke.log
          else
            echo "Gameplay smoke test skipped because import failed." > /tmp/godot-smoke.log
          fi

          INSPECT_CODE=0
          if [ "$IMPORT_CODE" = "0" ]; then
            timeout 120s "$GODOT" --headless --path . --script tools/inspect_assets.gd \
              > /tmp/godot-assets.log 2>&1
            INSPECT_CODE=$?
            cat /tmp/godot-assets.log
          else
            echo "Asset inspection skipped because import failed." > /tmp/godot-assets.log
          fi

          CODE=$IMPORT_CODE
          if [ "$CODE" = "0" ] && [ "$SMOKE_CODE" != "0" ]; then CODE=$SMOKE_CODE; fi
          if [ "$CODE" = "0" ] && [ "$INSPECT_CODE" != "0" ]; then CODE=$INSPECT_CODE; fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "import_code=$IMPORT_CODE" >> "$GITHUB_OUTPUT"
          echo "smoke_code=$SMOKE_CODE" >> "$GITHUB_OUTPUT"
          echo "inspect_code=$INSPECT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record validation result
        if: always()
        shell: bash
        run: |
          CODE='${{ steps.validation.outputs.code }}'
          IMPORT_CODE='${{ steps.validation.outputs.import_code }}'
          SMOKE_CODE='${{ steps.validation.outputs.smoke_code }}'
          INSPECT_CODE='${{ steps.validation.outputs.inspect_code }}'
          if [ -z "$CODE" ]; then CODE=999; fi
          if [ -z "$IMPORT_CODE" ]; then IMPORT_CODE=999; fi
          if [ -z "$SMOKE_CODE" ]; then SMOKE_CODE=999; fi
          if [ -z "$INSPECT_CODE" ]; then INSPECT_CODE=999; fi
          TESTED_SHA="$GITHUB_SHA"
          mkdir -p docs
          {
            echo '# Godot validation status'
            echo
            echo '- Engine: Godot 4.7.1 stable'
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Full asset import exit code: \`$IMPORT_CODE\`"
            echo "- Gameplay smoke-test exit code: \`$SMOKE_CODE\`"
            echo "- Asset inspection exit code: \`$INSPECT_CODE\`"
            echo "- Overall exit code: \`$CODE\`"
            if [ "$CODE" = "0" ]; then
              echo '- Result: **PASS**'
            else
              echo '- Result: **FAIL**'
            fi
            echo
            echo '## Tail of import log'
            echo
            echo '```text'
            tail -n 100 /tmp/godot-import.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Tail of gameplay smoke-test log'
            echo
            echo '```text'
            tail -n 140 /tmp/godot-smoke.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Tail of asset inspector log'
            echo
            echo '```text'
            tail -n 80 /tmp/godot-assets.log 2>/dev/null || true
            echo '```'
          } > docs/GODOT_VALIDATION.md

          git config user.name "Fallen Forest Godot Validator"
          git config user.email "actions@users.noreply.github.com"
          git add docs/GODOT_VALIDATION.md
          if [ -f docs/ASSET_IMPORT_REPORT.md ]; then git add docs/ASSET_IMPORT_REPORT.md; fi
          if ! git diff --cached --quiet; then
            git pull --rebase origin main || true
            git add docs/GODOT_VALIDATION.md
            if [ -f docs/ASSET_IMPORT_REPORT.md ]; then git add docs/ASSET_IMPORT_REPORT.md; fi
            git commit -m "Record Godot validation for $TESTED_SHA"
            git push origin HEAD:main || true
          fi

          if [ "$CODE" != "0" ]; then
            exit "$CODE"
          fi
