name: Validate Godot project

on:
  push:
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "assets/**"
      - ".github/workflows/godot-validate.yml"

permissions:
  contents: write

concurrency:
  group: godot-validate-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Godot 4.7.1 stable
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import and parse project
        id: validation
        shell: bash
        run: |
          set +e
          timeout 240s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path . --quit-after 8 \
            > /tmp/godot-validation.log 2>&1
          CODE=$?
          cat /tmp/godot-validation.log
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record validation result
        if: always()
        shell: bash
        run: |
          CODE='${{ steps.validation.outputs.code }}'
          if [ -z "$CODE" ]; then CODE=999; fi
          TESTED_SHA="$GITHUB_SHA"
          mkdir -p docs
          {
            echo '# Godot validation status'
            echo
            echo "- Engine: Godot 4.7.1 stable"
            echo "- Tested commit: \`$TESTED_SHA\`"
            echo "- Exit code: \`$CODE\`"
            if [ "$CODE" = "0" ]; then
              echo '- Result: **PASS**'
            else
              echo '- Result: **FAIL**'
            fi
            echo
            echo '## Tail of headless editor log'
            echo
            echo '```text'
            tail -n 120 /tmp/godot-validation.log 2>/dev/null || true
            echo '```'
          } > docs/GODOT_VALIDATION.md

          git config user.name "Fallen Forest Godot Validator"
          git config user.email "actions@users.noreply.github.com"
          git add docs/GODOT_VALIDATION.md
          if ! git diff --cached --quiet; then
            git pull --rebase origin main || true
            git add docs/GODOT_VALIDATION.md
            git commit -m "Record Godot validation for $TESTED_SHA"
            git push origin HEAD:main || true
          fi

          if [ "$CODE" != "0" ]; then
            exit "$CODE"
          fi
